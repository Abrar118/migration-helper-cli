[workspace]
resolver = "2"
members = ["crates/sidetrack-core", "crates/sidetrack", "crates/sidetrack-app"]
# The desktop app needs system WebView libraries (webkit2gtk on Linux) and a built
# frontend, so plain `cargo build` / `cargo test` leave it out. Build it with
# `cargo build -p sidetrack-app` or `npm run tauri dev` in crates/sidetrack-app.
default-members = ["crates/sidetrack-core", "crates/sidetrack"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Abrar118/migration-helper-cli"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "5"
tempfile = "3"
