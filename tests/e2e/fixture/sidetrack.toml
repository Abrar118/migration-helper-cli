# sidetrack configuration for the e2e fixture.
[database]
engine = "postgres"
service = "db"
user = "app"

[routing]
mode = "env"
file = ".env"
variable = "DATABASE_URL"
restart = ["api"]

[migrations]
tool = "generic"
dirs = ["migrations"]
command = "docker compose exec -T api sh /app/migrate.sh"
# migrate.sh records applied files here, so sidetrack can read the truth.
version_table = "schema_migrations"
version_column = "name"

[git]
main_branch = "main"
